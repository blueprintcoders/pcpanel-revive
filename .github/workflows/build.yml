name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach the exe to releases

jobs:
  # Built on the oldest supported Ubuntu so it runs on as many distros as possible (glibc is backward compatible).
  linux:
    runs-on: ubuntu-22.04
    env:
      PCPANEL_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - run: |
          mkdir dist
          cp target/release/pcpanel-revive dist/pcpanel-revive-linux-x86_64
          cd dist && sha256sum pcpanel-revive-linux-x86_64 | cut -d' ' -f1 | tr -d '\n' > pcpanel-revive-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pcpanel-revive-linux
          path: dist/

  build:
    needs: linux
    runs-on: windows-latest
    env:
      # Where the app looks for updates.
      PCPANEL_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      # The app checks downloads against this before installing an update.
      - run: (Get-FileHash target/release/pcpanel-revive.exe -Algorithm SHA256).Hash.ToLower() | Set-Content -NoNewline target/release/pcpanel-revive.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pcpanel-revive
          path: target/release/pcpanel-revive.exe
      - uses: actions/download-artifact@v4
        with:
          name: pcpanel-revive-linux
          path: dist-linux
      # Tag a version (git tag v0.1.0 && git push --tags) to publish a GitHub release with the exe.
      # Its notes are that version's section of CHANGELOG.md, followed by the list of commits.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $section = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $([regex]::Escape('${{ github.ref_name }}'))\s*(.*?)(?=^## |\z)")
          Set-Content -NoNewline -Encoding utf8 release-notes.md $section.Groups[1].Value.Trim()
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            target/release/pcpanel-revive.exe
            target/release/pcpanel-revive.exe.sha256
            dist-linux/pcpanel-revive-linux-x86_64
            dist-linux/pcpanel-revive-linux-x86_64.sha256
            packaging/linux/70-pcpanel.rules
            THIRD-PARTY-NOTICES.txt
          generate_release_notes: true
