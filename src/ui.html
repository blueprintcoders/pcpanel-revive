<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCPanel Revive</title>
<style>
:root{--bg:#141418;--panel:#1d1d23;--line:#2c2c35;--text:#e8e8ee;--dim:#9a9aa8;--acc:#4f9dff;--ok:#34c759;--bad:#ff453a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;user-select:none}
input,textarea{user-select:text}
header{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#18181d;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 8px 0 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.on{background:var(--ok)}
nav{display:flex;gap:4px;padding:10px 16px 0}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);border-radius:0}
nav button.sel{color:var(--text);border-color:var(--acc)}
main{padding:16px;max-width:1400px}
button,select,input{font:inherit;color:var(--text);background:#26262e;border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:#44444f}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.x{padding:2px 7px;color:var(--dim)}
button.small{padding:2px 8px;font-size:12px}
input[type=color]{padding:0;width:34px;height:28px}
input[type=number]{width:80px}
input[type=checkbox]{accent-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;transition:border-color .3s}
.card.hot{border-color:var(--acc)}
.card h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}
.card h3 input{flex:1;min-width:0}
.bar{height:4px;background:#2a2a33;border-radius:2px;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row>label:first-child{width:74px;color:var(--dim);font-size:12px}
.sub{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.sub>b{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.act{background:#23232a;border-radius:8px;padding:6px 8px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;background:#2f2f3a;border-radius:12px;padding:2px 4px 2px 6px;font-size:12px;max-width:100%}
.chip img{width:16px;height:16px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:none;background:none;padding:0 4px;color:var(--dim)}
.chips input{flex:1;min-width:80px;padding:3px 7px}
.hint{color:var(--dim);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-width:640px;margin-bottom:12px}
.panel h2{font-size:14px;margin:0 0 8px}
#log div{font:12px Consolas,monospace;padding:2px 0;border-bottom:1px solid var(--line);user-select:text}
#status{color:var(--dim);font-size:12px}
.spacer{flex:1}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;width:min(520px,92vw);max-height:84vh;overflow:hidden}
dialog::backdrop{background:#0009}
.pk{display:flex;flex-direction:column;max-height:84vh}
.pk-head{padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px}
.pk-head h2{margin:0;font-size:15px}
.pk-list{overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;flex:1}
.pk-sec{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:10px 6px 4px}
.pk-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:6px 8px}
.pk-item:hover{background:#26262e}
.pk-item.on{border-color:var(--acc);background:#1f2a3a}
.pk-item img,.pk-item .ph{width:24px;height:24px;flex:none}
.pk-item .ph{border-radius:6px;background:#33333d;display:grid;place-items:center;font-size:12px;color:var(--dim)}
.pk-item .nm{flex:1;min-width:0}
.pk-item .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-item .ex{font-size:11px;color:var(--dim)}
.pk-item .tick{color:var(--acc);font-weight:700;visibility:hidden}
.pk-item.on .tick{visibility:visible}
.badge{font-size:10px;color:var(--ok);border:1px solid #2f5f3a;border-radius:8px;padding:0 6px}
.pk-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctl-layout{display:grid;grid-template-columns:minmax(340px,540px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.ctl-layout{grid-template-columns:1fr}.device-wrap{position:static}}
.device-wrap{position:sticky;top:112px}
#device svg{width:100%;height:auto;display:block;max-height:calc(100vh - 150px)}
#device .hit{fill:transparent;stroke:transparent;stroke-width:2;transition:fill .15s}
#device .ctl{cursor:pointer}
#device .ctl:hover .hit{fill:#ffffff0d}
#device .ctl.sel .hit{fill:#4f9dff1f;stroke:var(--acc)}
#device .tag{font:700 15px "Segoe UI",sans-serif;text-anchor:middle}
#device .tag.big{font-size:19px}
#device .cap{font:12px "Segoe UI",sans-serif;fill:#c8c8d2}
#device .cap.unset{fill:#6a6a76;font-style:italic}
#device .glyph{font-size:11px}
#device .logo{font:900 22px "Segoe UI",sans-serif;text-anchor:middle}
#device .logo.sm{font-size:9px;letter-spacing:.2em}
#device svg.anim-rainbow .led,#device svg.anim-wave .led{animation:hue var(--speed) linear infinite;animation-delay:calc(var(--i) * -.25s)}
#device svg.anim-breath .led{animation:breath var(--speed) ease-in-out infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes breath{50%{opacity:.25}}
#device svg g.fx-pulse .led{filter:none;animation:apulse var(--p) ease-in-out infinite}
#device svg g.fx-blink .led{filter:none;animation:ablink var(--p) steps(1) infinite}
@keyframes apulse{0%,100%{opacity:.12}50%{opacity:1}}
@keyframes ablink{0%{opacity:1}50%{opacity:0}}
.alerts{display:flex;flex-direction:column;gap:14px}
.alert.off{opacity:.55}
.alert .ed-head{gap:10px}
.alert .ed-head h2{font-size:16px}
.alert-on input{width:18px;height:18px}
.light-picks{display:flex;flex-wrap:wrap;gap:4px}
.light-picks .pick{min-width:44px;padding:4px 8px;font-size:12px}
.light-picks .pick.on{background:var(--acc);border-color:var(--acc);color:#fff}
.badge-live[hidden]{display:none}
.badge-live{font-size:11px;color:#ffc45c;border:1px solid #6b5520;border-radius:8px;padding:1px 8px}
.center{text-align:center;margin-top:6px}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 22px 16px;max-width:660px}
.ed-head{display:flex;align-items:center;gap:14px;padding:14px 0 10px}
.ed-head h2{margin:0;font-size:20px;white-space:nowrap}
.ed-label{flex:1;min-width:0;background:transparent;border-color:transparent;font-size:15px}
.ed-label:hover,.ed-label:focus{background:#26262e;border-color:var(--line)}
.sec{padding:12px 0;border-top:1px solid var(--line)}
.sec h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--dim)}
.editor .row>label:first-child{width:96px;flex:none}
.editor .act{background:none;border-radius:0;padding:4px 0;margin:0}
.editor .act + .act{border-top:1px dashed var(--line)}
.act-top{display:flex;align-items:center;gap:8px}
.act-top select{flex:1;max-width:320px}
button.link{background:none;border:none;color:var(--acc);padding:4px 0}
button.link:hover{text-decoration:underline}
.folds{border-top:1px solid var(--line);margin-top:4px}
.fold{border-bottom:1px solid var(--line)}
.fold:last-child{border-bottom:none}
.fold summary{display:flex;align-items:center;gap:10px;padding:11px 0;cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--dim)}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:'›';display:inline-block;width:10px;transition:transform .15s}
.fold[open] summary::before{transform:rotate(90deg)}
.fold summary .sum{margin-left:auto;font-weight:400;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-body{padding:0 0 12px 20px}
.swatches{display:inline-flex;gap:4px;vertical-align:middle}
.swatches i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid #0006}
.swatches i.mute{border-radius:50%}
.notice{display:flex;align-items:center;gap:10px;margin:14px 16px 0;padding:12px 12px 12px 16px;border:1px solid #2d4a73;background:#17243a;border-radius:10px;max-width:1100px}
.notice[hidden]{display:none}
.notice .nt-body{flex:1}
.notice button{height:34px;min-width:34px;padding:0 16px;display:inline-grid;place-items:center;flex:none}
.notice button.x{padding:0;width:34px;font-size:16px;color:var(--dim);background:#26262e;border:1px solid var(--line)}
.notice ul{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:12px}

.combo{position:relative;display:inline-flex;align-items:center;min-width:200px;max-width:100%;vertical-align:middle}
.combo.strict{justify-content:space-between;gap:12px;text-align:left}
.combo.strict .val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo .chev{color:var(--dim);font-size:11px;flex:none}
.combo.free .chev{position:absolute;right:10px;cursor:pointer}
.combo.free input{width:100%;padding-right:28px}
.combo.open,.combo.free.open input{border-color:var(--acc)}
.combo input.recording{border-color:#ff453a;color:#ff8a80}
.pop{position:fixed;z-index:50;display:flex;flex-direction:column;background:#202027;border:1px solid #3a3a46;border-radius:10px;box-shadow:0 14px 36px #000a;padding:6px;max-width:min(460px,92vw)}
.pop-search{margin:0 0 6px;width:100%}
.pop-list{overflow-y:auto;min-height:0}
.pop .grp{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}
.pop .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.pop .it.hi{background:#2c3850}
.pop .it .ck{width:14px;color:var(--acc);flex:none}
.pop .it .lb{overflow:hidden;text-overflow:ellipsis}
.pop .it .v{margin-left:auto;padding-left:16px;font:11px Consolas,monospace;color:var(--dim)}
.pop .it.run .lb{color:var(--acc)}
.pop .empty{padding:8px 10px;color:var(--dim)}
.ed-status{display:flex;align-items:center;gap:10px;margin:-4px 0 10px;font-size:12px;color:var(--dim)}
.ed-status[hidden]{display:none}
.ed-status .warn{color:#ffc45c}
.ed-status .lvl{flex:1;max-width:220px;height:4px;border-radius:2px;background:#2a2a33;overflow:hidden}
.ed-status .lvl i{display:block;height:100%;background:var(--acc)}
button.x.try{color:var(--acc)}
.hint.indent{margin:-4px 0 8px 104px}
.bk-time{min-width:200px}
button.icon{width:34px;padding:5px 0;font-size:16px;line-height:1}
button.icon:disabled{opacity:.35}
#status{min-width:110px;text-align:right}
.displays{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.row:has(> .displays)>label:first-child{align-self:flex-start;padding-top:2px}
.editor .row>input:not([type]),.editor .row>.combo.free{flex:1;min-width:220px}
textarea{flex:1;min-width:220px;font:12px Consolas,monospace;color:var(--text);background:#26262e;border:1px solid var(--line);border-radius:6px;padding:6px 9px;resize:vertical}
.presets-panel{max-width:1100px}
.light-layout{display:grid;grid-template-columns:minmax(360px,560px) minmax(0,1fr);gap:24px;align-items:start}
.light-layout .panel{max-width:none}
.light-layout>div:first-child{position:sticky;top:90px}
@media (max-width:980px){.light-layout>div:first-child{position:static}}
@media (max-width:980px){.light-layout{grid-template-columns:1fr}}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.preset{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:10px;border-radius:10px;background:#202027}
.preset:hover{border-color:var(--acc)}
.preset .hint{line-height:1.3}
.pv-wrap{width:100%;margin-bottom:4px}
.pv-dev{display:block;width:100%;height:auto;max-height:230px}
.pv-anim .led{animation:hue 4s linear infinite;animation-delay:calc(var(--i) * -.3s)}
.viz-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.viz-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;font-size:12px}
.viz-chip i{width:26px;height:14px;border-radius:4px;display:inline-block}
.viz-chip.on{border-color:var(--acc);background:#1f2a3a}
.row:has(> .viz-chips)>label:first-child{align-self:flex-start;padding-top:5px}
#selftest,#setup{width:min(620px,94vw)}
.setup-rows{display:grid;grid-template-columns:auto auto 1fr;gap:6px 14px;margin:12px 0 16px;font-size:13px}
.setup-rows b{color:var(--acc)}
.st{padding:16px 18px 18px}
.st-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.st-head h2{margin:0;font-size:16px}
.st-head .x{margin-left:auto}
.st-now{font-size:28px;font-weight:700;margin:6px 0 10px}
.st .lvl{height:6px;border-radius:3px;background:#2a2a33;overflow:hidden;flex:1}
.st .lvl i{display:block;height:100%;background:var(--acc)}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:10px 0 14px}
.st-item{display:flex;align-items:center;gap:10px;font-size:13px}
.st-item>span:first-child{width:92px}
.st-item b{width:14px;color:var(--ok)}
.st-item.ok .lvl i{background:var(--ok)}
#device svg.wood .cap{fill:#3b2412}
#device svg.wood .cap.unset{fill:#7a5a3a}
#device svg.wood .glyph{filter:brightness(.25)}
.notice.warn{border-color:#7a5520;background:#2a2112}
</style>
</head>
<body>
<header>
  <h1>PCPanel Revive</h1>
  <span class="dot" id="dot"></span><span id="conn" class="hint"></span>
  <span class="spacer"></span>
  <label class="hint">Profile</label>
  <span id="profileBox"></span>
  <button id="pNew">New</button><button id="pRen">Rename</button><button id="pDel">Delete</button>
  <span id="status"></span>
  <button id="undo" class="icon" title="Undo (Ctrl+Z)" disabled>↶</button><button id="redo" class="icon" title="Redo (Ctrl+Y)" disabled>↷</button>
</header>
<nav id="tabs"></nav>
<div id="conflict" class="notice warn" hidden></div>
<div id="notice" class="notice" hidden></div>
<main id="main"></main>
<input type="file" id="importFile" accept=".json" hidden>
<dialog id="picker"></dialog>
<dialog id="selftest"></dialog>
<dialog id="setup"></dialog>
<input type="file" id="profileFile" accept=".json" hidden>
<input type="file" id="browse" accept=".exe" multiple hidden>
<script>

const ACT_HINT = {cheat_sheet: 'Shows what every knob and slider does, on screen. Under Hold: while you hold the knob. Under a press: for 8 seconds, or until you press again. After a Shift action, it shows the other profile.',

  cycle_default:'Cycle default devices', keys:'Keystroke / media key', run:'Run program', kill:'Kill process', profile:'Switch profile', next_profile:'Next profile',

const put = (el, ...k) => el.replaceChildren(...k.flat(9).filter(x => x != null && x !== false));
const toHost = m => window.ipc && window.ipc.postMessage(m);
const setDirty = d => { dirty = d; toHost(d ? 'dirty' : 'clean'); };
const touch = () => { if (previewModel) { $('#status').textContent = 'Preview - changes aren\'t saved'; drawDevice(); return; } setDirty(true); $('#status').textContent = 'Saving...'; drawDevice(); clearTimeout(saveTimer); saveTimer = setTimeout(autosave, 500); };
let lastSaveAt = 0, saveTimer = null, saving = false, lastSaved = null, history = [], future = [], autostart = false;

    PageUp: 'pgup', PageDown: 'pgdn', ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', PrintScreen: 'printscreen',
    MediaPlayPause: 'play_pause', MediaTrackNext: 'next', MediaTrackPrevious: 'prev', MediaStop: 'stop',
    AudioVolumeMute: 'mute', AudioVolumeUp: 'vol_up', AudioVolumeDown: 'vol_down', BracketLeft: '[', BracketRight: ']', Comma: ',', Period: '.',
    Minus: '-', Equal: '=', Semicolon: ';', Quote: '\'', Slash: '/', Backslash: '\\', Backquote: '`'};
  const finish = v => {
    window.removeEventListener('keydown', onKey, true);

  };

}

function applyPreset(pr) {
  const p = prof(), l = p.lighting;
  l.brightness = pr.brightness;
  if (pr.mode) {
    Object.assign(l, {mode: pr.mode}, pr.wave);
  } else {
    l.mode = 'custom';
    // Keep each control's mute color; only the look changes.
    pr.knobs.forEach(([mode, c1, c2], i) => Object.assign(p.controls[i].light, {mode, color: c1, color2: c2 || c1}));
    pr.sliders.forEach(([mode, c1, c2], k) => {
      const c = p.controls[KNOBS + k];
      Object.assign(c.light, {mode, color: c1, color2: c2 || c1});

// A small drawing of the connected model wearing a preset: knob rings, slider strips, labels and logo.
// A knob whose color follows its position is drawn at about two thirds of a turn, as the whole ring really looks.
function presetSvg(pr) {
  const pro = isPro(), H = pro ? 610 : 244, KP = pro ? KNOB_POS : MINI_KNOBS;
  const hue = i => `hsl(${(i * 40) % 360} 90% 55%)`;
  const knob = i => pr.knobs ? pr.knobs[i] : ['static', hue(i)];
  const slider = k => pr.sliders ? pr.sliders[k] : ['gradient', hue(KNOBS + k), hue(KNOBS + k + 1)];
  const pt = (cx, cy, r, deg) => [cx + r * Math.sin(deg * Math.PI / 180), cy - r * Math.cos(deg * Math.PI / 180)];
  const ring = (cx, cy) => { const [x0, y0] = pt(cx, cy, 38, -135), [x1, y1] = pt(cx, cy, 38, 135); return `M${x0} ${y0}A38 38 0 1 1 ${x1} ${y1}`; };
  let s = `<svg viewBox="0 0 500 ${H}" class="pv-dev${pr.mode ? ' pv-anim' : ''}">
    <rect x="8" y="8" width="484" height="${H - 16}" rx="${pro ? 38 : 20}" fill="${pro ? '#8f94a0' : '#c4c7ce'}"/>
    <rect x="18" y="18" width="464" height="${H - 36}" rx="${pro ? 30 : 12}" fill="${pro ? '#1f1f24' : '#141417'}"/>`;
  KP.forEach(([cx, cy], i) => {
    const [m, a, b] = knob(i), c = m === 'gradient' ? mix(a, b || a, 0.65) : a;
    s += `<path class="led" style="--i:${i}" d="${ring(cx, cy)}" stroke="${c}" stroke-width="11" fill="none" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="25" fill="#8d909a"/>`;
  });
  for (let k = 0; k < (pro ? 4 : 0); k++) {
    const [m, a, b] = slider(k), x = SLIDER_X[k], left = k < 2, sx = left ? x - 30 : x + 12;
    for (let seg = 0; seg < 5; seg++) {
      // Top segment first; "fill with position" is drawn about 60% full.
      let c = m === 'static' ? a : mix(a, b || a, 1 - seg / 4);
      if (m === 'volume' && seg < 2) c = OFF;
      if (!pr.sliders) c = hue(KNOBS + k + seg);
      s += `<rect class="led" style="--i:${KNOBS + k + seg}" x="${sx}" y="${330 + seg * 38}" width="18" height="32" rx="3" fill="${c}"/>`;
    }
    s += `<rect x="${x - 5}" y="326" width="10" height="194" rx="5" fill="#5c5e66"/><rect x="${x - 17}" y="${440 - 24}" width="34" height="48" rx="4" fill="#9a9da7"/>`;
    const lbl = pr.labels === undefined ? hue(KNOBS + k) : pr.labels === 'match' ? a : pr.labels;
    if (lbl) s += `<text class="led" style="--i:${KNOBS + k}" x="${left ? x - 30 : x + 30}" y="316" text-anchor="middle" font-size="30" font-weight="700" fill="${lbl}">S${k + 1}</text>`;
  }
  if (pro) {
    const lg = pr.logo || {mode: 'rainbow'};
    const c = lg.mode === 'none' ? '#3a3a42' : lg.mode === 'static' ? lg.color : lg.mode === 'breath' ? `hsl(${(lg.hue || 0) * 1.41} 90% 55%)` : hue(3);
    s += `<text class="led" style="--i:3" x="250" y="512" text-anchor="middle" font-size="34" font-weight="900" fill="${c}">PC</text>`;
  }
  return s + '</svg>';
}

  const r = await fetch('/api/restore', {method: 'POST', headers: {'X-PCP': '1'}, body: name});

// Changes save themselves; each save is one undo step.
async function postConfig(json) {
  saving = true;
  try {
    const r = await fetch('/api/config', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-PCP': '1'}, body: json});
    if (!r.ok) { $('#status').textContent = 'Couldn\'t save: ' + await r.text(); return false; }
    // Remember the server's (normalized) copy so the poll doesn't treat our own save as an outside change.
    lastSaveAt = Date.now();
    return true;
  } catch (e) {
    $('#status').textContent = 'Couldn\'t save - is the app running?';
    return false;
  } finally { saving = false; }
}
async function autosave() {
  clearTimeout(saveTimer); saveTimer = null;
  const now = JSON.stringify(cfg);
  if (now === lastSaved) { setDirty(false); $('#status').textContent = 'All changes saved'; return; }
  if (!await postConfig(now)) return;
  if (lastSaved) { history.push(lastSaved); if (history.length > 100) history.shift(); future = []; }
  lastSaved = now;
  setDirty(false);
  $('#status').textContent = 'All changes saved';
  updateUndo();
}
async function undoRedo(back) {
  if (saveTimer) await autosave();
  const from = back ? history : future, to = back ? future : history;
  if (!from.length) return;
  closeCombo();
  to.push(lastSaved);
  const state = from.pop();
  if (!await postConfig(state)) { from.push(state); to.pop(); return; }
  lastSaved = state; cfg = JSON.parse(state);
  setDirty(false);
  $('#status').textContent = back ? 'Undone' : 'Redone';
  updateUndo(); render();
}
function updateUndo() {
  $('#undo').disabled = !history.length;
  $('#redo').disabled = !future.length;
}
window.autosave = autosave;

async function poll() {
  try {
    const s = await (await fetch('/api/state')).json();
    $('#dot').className = 'dot' + (s.connected ? ' on' : '');
    $('#conn').textContent = previewModel ? `Previewing the ${{pro: 'PCPanel Pro', mini: 'PCPanel Mini', original: 'original wooden PCPanel'}[previewModel] || previewModel} layout - nothing is saved` : s.connected ? `${s.model_name} connected` : 'PCPanel not found';
    if (!previewModel && s.connected && s.model && s.model !== model) { model = s.model; if (!isPro() && sel >= 4) sel = 0; if (cfg && !dirty) render(); }
    const moved = lastValues.length ? s.values.findIndex((v, i) => Math.abs(v - lastValues[i]) > 2) : -1;
    const changed = JSON.stringify(s.values) !== JSON.stringify(lastValues) || JSON.stringify(s.muted) !== JSON.stringify(muted);
    const presentChanged = JSON.stringify(s.present) !== JSON.stringify(present);
    drawConflict(!!s.official_running);
    const peaksChanged = JSON.stringify(s.peaks || []) !== JSON.stringify(peaks);
    peaks = s.peaks || [];
    if (peaksChanged) drawDevice();
    const alertsChanged = JSON.stringify(s.alerts_on || []) !== JSON.stringify(alertsOn);
    alertsOn = s.alerts_on || [];
    if (alertsChanged) { drawDevice(); document.querySelectorAll('.badge-live').forEach(b => b.hidden = !alertsOn[+b.dataset.n]); }
    lastValues = s.values; muted = s.muted || []; levels = s.levels || []; present = s.present || [];
    drawStatus();
    if (presentChanged) drawDevice();
    const ed = $('#editor'), typing = ed && ed.contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);
    if (moved >= 0 && tab === 'controls' && !$('#picker').open && !typing && !openCombo) selectCtl(moved);
    if (changed) drawDevice();
    const log = $('#log');
    if (log) put(log, h('h2', {}, 'Log'), s.log.length ? s.log.slice().reverse().map(l => h('div', {}, l)) : h('div', {class: 'hint'}, 'Nothing yet.'));
    const j = JSON.stringify(s.config);
    autostart = !!s.autostart;
    const upd = JSON.stringify([s.version, s.can_update, s.update, s.update_note]);
    if (upd !== JSON.stringify([appVersion, canUpdate, updateInfo, updateNote])) {
      // A new version started after an update: load its settings page.
      if (appVersion && s.version && s.version !== appVersion) location.reload();
      [appVersion, canUpdate, updateInfo, updateNote] = [s.version, s.can_update, s.update || null, s.update_note || ''];
      $('#updates')?._draw();

    if (j !== lastCfgJson && Date.now() - lastSaveAt < 2000) lastCfgJson = j;
    if (!dirty && !saving && j !== lastCfgJson && !$('#picker').open) {
      lastCfgJson = j; cfg = s.config; lastSaved = JSON.stringify(cfg); render(); offerSetup();
      if (!$('#status').textContent) $('#status').textContent = 'All changes saved';
    }
  } catch (e) { $('#conn').textContent = 'background app not running'; $('#dot').className = 'dot'; }
  setTimeout(poll, 300);
}

  const draw = () => put(box,
    h('label', {}, h('input', {type: 'checkbox', checked: !o[k].length, onchange: e => { if (e.target.checked) { o[k] = []; touch(); draw(); } }}), ' All displays'),
    displayList.map(d => h('label', {}, h('input', {type: 'checkbox', checked: o[k].includes(d.id), onchange: e => {
      o[k] = e.target.checked ? [...o[k], d.id] : o[k].filter(x => x !== d.id); touch(); draw();
    }}), ' ' + d.name)),
    h('div', {class: 'hint'}, !o[k].length
      ? 'Turns every screen off. Move the mouse or press a key to wake them.'
      : 'Each press turns these off, and the next press back on. Uses DDC/CI - if nothing happens, turn DDC/CI on in the monitor\'s own menu. Laptop screens only work with \"All displays\".'));
  draw();
  return box;
}

$('#undo').onclick = () => undoRedo(true);
$('#redo').onclick = () => undoRedo(false);
document.addEventListener('keydown', e => {
  if (!e.ctrlKey || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return; // text boxes keep their own undo
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoRedo(true); }
  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); undoRedo(false); }
});
// Full value of anything cut off with "...", on hover.
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('.val, .sum, .lb, .chip span, .nm div, .ex, input:not([type])');
  if (!el) return;
  const full = el.value ?? el.textContent;
  el.title = el.scrollWidth > el.clientWidth + 1 ? full : (el.dataset.title || '');
});
$('#pNew').onclick = () => {
  const n = prompt('New profile name (copies the current one):');
  if (!n || cfg.profiles[n]) return;
  cfg.profiles[n] = JSON.parse(JSON.stringify(prof()));
  cfg.profiles[n].auto_apps = [];
  cfg.active = n; touch(); render();
};
$('#pRen').onclick = () => {
  const n = prompt('Rename profile to:', cfg.active);
  if (!n || cfg.profiles[n]) return;
  const old = cfg.active;
  cfg.profiles[n] = prof(); delete cfg.profiles[old]; cfg.active = n;
  // Keep everything that points at the profile by name.
  const ps = cfg.profile_slider;
  if (ps) ps.profiles = (ps.profiles || []).map(x => x === old ? n : x);
  if (ps && ps.colors && ps.colors[old]) { ps.colors[n] = ps.colors[old]; delete ps.colors[old]; }
  for (const p of Object.values(cfg.profiles)) for (const c of p.controls) for (const a of [...c.press, ...c.double, ...c.hold])
    if ((a.type === 'profile' && a.name === old) || (a.type === 'shift' && a.profile === old)) a.type === 'profile' ? a.name = n : a.profile = n;
  touch(); render();
};
$('#pDel').onclick = () => {
  if (Object.keys(cfg.profiles).length < 2 || !confirm(`Delete profile "${cfg.active}"?`)) return;
  delete cfg.profiles[cfg.active]; cfg.active = Object.keys(cfg.profiles)[0]; touch(); render();
};
window.addEventListener('focus', loadDevices);
loadDevices();
checkStock();
loadApps().then(() => cfg && !dirty && render());
poll();
</script>
</body>
